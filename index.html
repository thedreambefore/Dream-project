<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢沙 DreamSand | 匿名星塵願望交易所</title>
    <!-- 引入 Tailwind CSS (讓我們可以直接用文字控制網頁漂亮的外觀) -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* 額外加上星空深色背景的微調 */
        body {
            background-color: #0b111e;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen font-sans">

    <!-- 1. 頂部導覽列 (Navbar) -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl">⏳</span>
            <span class="text-xl font-bold bg-gradient-to-r from-amber-400 to-yellow-200 bg-clip-text text-transparent">夢沙 DreamSand</span>
        </div>
        <!-- 右側送禮者資訊（你提到的溫暖頭像辨識區） -->
        <div class="flex items-center gap-3 bg-slate-800/50 px-4 py-1.5 rounded-full border border-slate-700">
            <img src="https://dicebear.com" alt="頭像" class="w-7 h-7 rounded-full bg-slate-600">
            <div class="text-sm">
                <span class="text-slate-300">哈囉，</span><span class="font-semibold text-amber-400">王小明</span>
            </div>
            <div class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full ml-1">
                🌟 500 顆
            </div>
        </div>
    </nav>

    <!-- 2. 主標題區 (Hero Banner) -->
    <header class="max-w-4xl mx-auto text-center my-12 px-4">
        <h1 class="text-4xl font-extrabold mb-4">用陌生人的善意，拼湊夢想的沙漏</h1>
        <p class="text-slate-400 text-base max-w-xl mx-auto">
            這裡不看名氣，只聽故事。投入微小的星塵碎片，當沙漏填滿時，漂流瓶留言將與夢想一同解鎖。
        </p>
    </header>

    <!-- 3. 故事牆瀑布流 (Story Grid) -->
    <main class="max-w-6xl mx-auto px-6 pb-24">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- 故事卡片 1 -->
            <div class="rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-xl hover:border-amber-500/40 transition-all duration-300 group flex flex-col justify-between">
                <div>
                    <!-- 模糊封面與標籤 -->
                    <div class="relative h-44 bg-slate-950 overflow-hidden">
                        <div class="absolute inset-0 bg-cover bg-center filter blur-md opacity-40 scale-110" style="background-image: url('https://unsplash.com');"></div>
                        <span class="absolute top-4 left-4 bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-2.5 py-1 rounded-full font-medium">
                            #學生苦讀中
                        </span>
                    </div>
                    <!-- 內容區 -->
                    <div class="p-6">
                        <h3 class="text-lg font-bold group-hover:text-amber-400 transition-colors">重考三年的深夜檯燈</h3>
                        <p class="mt-3 text-sm text-amber-200/80 bg-amber-500/5 border border-amber-500/10 p-3 rounded-lg italic">
                            「考上後，我會將這盞燈與滿滿筆記無償傳承給平台下一個人。」
                        </p>
                    </div>
                </div>
                <!-- 底部沙漏進度與按鈕 -->
                <div class="p-6 pt-0">
                    <div class="mt-4">
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-1.5">
                            <span>⏳ 聚沙成塔中...</span>
                            <span class="font-mono text-slate-300">350 / 1000 顆星塵 (35%)</span>
                        </div>
                        <!-- 進度條軌道 -->
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-amber-500 to-yellow-300 h-full rounded-full shadow-[0_0_8px_rgba(251,191,36,0.5)]" style="width: 35%"></div>
                        </div>
                    </div>
                    <button class="mt-5 w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-bold py-2.5 px-4 rounded-xl shadow-md transition-all active:scale-98 flex items-center justify-center gap-2 cursor-pointer">
                        <span>🌟</span> 注入星塵
                    </button>
                </div>
            </div>

            <!-- 你可以在這裡複製上面的結構，做出卡片 2、卡片 3... -->

        </div>
    </main>

</body>
</html>
